services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgis-init/zzz-slim-postgis.sql:/docker-entrypoint-initdb.d/zzz-slim-postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: &app_build
      context: .
      dockerfile: Dockerfile.dev
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    command: bundle exec hanami server --host 0.0.0.0
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HANAMI_PORT: "2300"
      HANAMI_ENV: development
    ports:
      - "2300:2300"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # Builds JS/CSS with esbuild and rebuilds on change, writing public/assets served by web.
  assets:
    build: *app_build
    command: bash -c "npm install && bundle exec hanami assets watch"
    environment:
      HANAMI_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  pg_data:
  node_modules:
